name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Types only; this does not need the wasm artifact.
      - run: pnpm check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Builds libghostty-vt for wasm32-freestanding from the pinned ghostty
      # revision, then the site around it. Reproducible, but cold runs pay for
      # the Zig build.
      - run: nix build .#default

      # `result` is a symlink into the read-only nix store; the Pages artifact
      # action needs a real, writable directory.
      - name: Materialise build output
        run: |
          mkdir -p dist
          cp -rL result/. dist/
          chmod -R u+w dist

      - name: Verify the wasm shipped
        run: test -s dist/ghostty-vt.wasm

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: [check, build]
    # Manual runs can select another ref; never deploy one of those by accident.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
